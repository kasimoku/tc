<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>タイムカード</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIMECARD">
<script>(function(){var t=null;try{t=localStorage.getItem('tc_theme')}catch(e){}
if(t!=='light'&&t!=='dark'){try{t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}catch(e){t='dark'}}
document.documentElement.setAttribute('data-theme',t);
document.write('<meta name="theme-color" content="'+(t==='light'?'#f5f5f8':'#0f0f11')+'">');})();</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="tc-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="tc-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="tc-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="768x768" href="tc-favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0f0f11;--surface:#1a1a1f;--surface2:#22222a;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --text:#f0f0f2;--text2:#888894;--text3:#555560;
  --accent:#7c6cfa;--accent2:#5a4de0;
  --green:#3ecf8e;--red:#f06b6b;--amber:#f0a030;
  --blue:#6b8fcc;--break:#6f6f7e;
  --topbar:rgba(15,15,17,.93);
  --overlay:rgba(0,0,0,.75);
  --accent-soft:rgba(124,108,250,.10);
  --worked-bg:rgba(62,207,142,.10);--worked-bg2:rgba(62,207,142,.18);--worked-border:rgba(62,207,142,.25);
  --mono:'DM Mono',monospace;--sans:'Noto Sans JP',sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f5f8;--surface:#ffffff;--surface2:#eeeef3;
  --border:rgba(18,18,32,.10);--border2:rgba(18,18,32,.20);
  --text:#17171c;--text2:#5c5c68;--text3:#8a8a96;
  --accent:#5b4bd6;--accent2:#4436c0;
  --green:#0f9a63;--red:#d24b4b;--amber:#b8760c;
  --blue:#3a6ba8;--break:#6f6f7e;
  --topbar:rgba(245,245,248,.93);
  --overlay:rgba(18,18,32,.45);
  --accent-soft:rgba(91,75,214,.10);
  --worked-bg:rgba(15,154,99,.10);--worked-bg2:rgba(15,154,99,.18);--worked-border:rgba(15,154,99,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

.top-bar{position:sticky;top:0;z-index:50;background:var(--topbar);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:8px}
.app-name{font-family:var(--mono);font-size:20px;color:var(--accent);letter-spacing:.08em;flex-shrink:0}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:5px 12px 5px 7px;cursor:pointer;font-size:20px;color:var(--text2);transition:border-color .2s;min-width:0}
.user-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip:hover{border-color:var(--border2);color:var(--text)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:17px;font-family:var(--mono);color:#fff;flex-shrink:0}
.icon-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--text2);display:flex;align-items:center;transition:all .15s}
.icon-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.icon-btn svg{width:20px;height:20px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:var(--overlay);align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:24px 22px 20px;width:min(420px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto}
.modal h3{font-size:25px;font-weight:500;margin-bottom:14px}
.modal-footer{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.btn{border:none;border-radius:9px;padding:9px 18px;font-size:20px;font-weight:500;font-family:var(--sans);cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.t-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:22px;color:var(--text);font-family:var(--sans);outline:none;width:100%;transition:border-color .15s}
.t-input:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:80%;margin:0 auto 12px}
.input-group{display:flex;flex-direction:column;gap:5px;min-width:0}
.input-label{font-size:17px;color:var(--text3)}
.time-inp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 6px;text-align:center;font-size:23px;color:var(--text3);font-family:var(--mono);outline:none;width:100%;min-width:0;transition:border-color .15s}
.time-inp:focus{border-color:var(--accent)}
.time-inp::-webkit-calendar-picker-indicator{display:none}
.time-inp::-webkit-date-and-time-value{text-align:center}
.time-inp:valid{color:var(--text)}

.main{max-width:640px;margin:0 auto;padding:20px 12px 0}

.tab-bar{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:18px}
.tab{flex:1;text-align:center;padding:9px 2px;font-size:20px;color:var(--text2);border-radius:8px;cursor:pointer;border:none;background:none;font-family:var(--sans);transition:all .15s}
.tab.active{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
@media (max-width:360px){.tab{font-size:17px}}
.subtab-bar{display:flex;gap:6px;margin-bottom:18px}
.subtab{flex:1;text-align:center;padding:8px 2px;font-size:18px;color:var(--text3);border-radius:99px;cursor:pointer;border:1px solid var(--border);background:none;font-family:var(--sans);transition:all .15s}
.subtab:hover{color:var(--text2);border-color:var(--border2)}
.subtab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
@media (max-width:360px){.subtab{font-size:16px}}

/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text2);transition:all .15s;display:flex;align-items:center}
.cal-nav-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.cal-nav-btn svg{width:19px;height:19px}
.cal-month{font-family:var(--mono);font-size:25px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
.cal-dow{text-align:center;font-size:17px;color:var(--text3);padding:6px 0;letter-spacing:.06em}
.cal-dow:first-child{color:var(--red)}
.cal-dow:last-child{color:var(--blue)}
.cal-cell{aspect-ratio:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;transition:all .15s;position:relative;border:1px solid transparent;gap:3px}
.cal-cell:hover{background:var(--surface2);border-color:var(--border)}
.cal-cell.empty{pointer-events:none}
.cal-cell.today{border-color:var(--accent)!important;background:var(--accent-soft)}
.cal-cell.worked{background:var(--worked-bg);border-color:var(--worked-border)}
.cal-cell.worked:hover{background:var(--worked-bg2)}
.cal-day{font-size:20px;font-family:var(--mono);line-height:1}
.cal-cell.sun .cal-day{color:var(--red)}
.cal-cell.sat .cal-day{color:var(--blue)}
.cal-cell.other-month .cal-day{color:var(--text3)}
.cal-hours{font-size:14px;font-family:var(--mono);color:var(--green)}
.cal-summary{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 16px}
.cal-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cal-metric{text-align:center}
.cal-metric-label{font-size:17px;color:var(--text3);margin-bottom:5px;letter-spacing:.08em}
.cal-metric-value{font-family:var(--mono);font-size:40px;font-weight:500}
.cal-metric-value.green{color:var(--green)}
.cal-metric-value.amber{color:var(--amber)}

/* SCHEDULE */
.sch-date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sch-date-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text2);transition:all .15s;display:flex;align-items:center}
.sch-date-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.sch-date-btn svg{width:19px;height:19px}
.sch-date-label{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--text)}
.sec{font-size:20px;letter-spacing:.12em;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* TIMELINE */
.tl-half{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 12px;margin-bottom:12px}
.tl-period{font-size:20px;font-family:var(--mono);color:var(--text);letter-spacing:.08em;margin-bottom:10px}
.tl-axis{position:relative;height:16px;margin-bottom:4px}
.tl-tick{position:absolute;font-size:14px;color:var(--text);font-family:var(--mono)}
.tl-track{position:relative;height:42px;background:var(--surface2);border-radius:8px;margin-bottom:10px;cursor:crosshair;overflow:hidden}
.tl-gridlines{position:absolute;inset:0;display:flex;pointer-events:none;border-radius:8px;overflow:hidden}
.tl-gcell{flex:1;border-right:1px solid var(--border)}
.tl-gcell:last-child{border-right:none}
.tl-bar{position:absolute;top:5px;height:32px;border-radius:5px;display:flex;align-items:center;overflow:hidden;cursor:pointer;transition:opacity .15s;z-index:2;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tl-bar:hover{opacity:.82}
.tl-bar.brk{background:var(--break);justify-content:center;overflow:visible;z-index:3}
.brk-icon{width:28px;height:28px;flex-shrink:0;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.brk-inline{width:24px;height:24px;vertical-align:-6px;margin-right:5px;image-rendering:pixelated;flex-shrink:0}
.brk-pop .brk-inline{width:21px;height:21px;vertical-align:-5px;margin-right:4px}
.brk-pop{position:fixed;z-index:150;display:none;transform:translate(-50%,-100%);background:var(--break);color:#fff;border-radius:99px;padding:7px 15px;font-size:17px;font-family:var(--sans);white-space:nowrap;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.4);-webkit-user-select:none;user-select:none;transition:background .15s}
.brk-pop.show{display:block}
.brk-pop:hover{background:var(--accent)}
.brk-pop::after{content:'';position:absolute;left:var(--arrow-x,50%);bottom:-4px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tl-bar-text{font-size:16px;font-weight:500;color:#fff;white-space:nowrap;padding:0 6px;overflow:hidden;text-overflow:ellipsis}
.tl-hint{font-size:20px;color:var(--text2);text-align:center;padding:2px 0 4px}
.task-list{display:flex;flex-direction:column;gap:7px}
.task-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;animation:slideIn .18s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.task-info{flex:1;min-width:0}
.task-name-d{font-size:23px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.task-time-d{font-family:var(--mono);font-size:18px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-actions{display:flex;gap:4px;flex-shrink:0}
.task-act-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:5px;transition:all .15s;display:flex}
.task-act-btn:hover{color:var(--accent);background:var(--accent-soft)}
.task-act-btn.del:hover{color:var(--red);background:rgba(240,107,107,.1)}
.task-act-btn svg{width:18px;height:18px}
.add-task-btn{width:100%;background:none;border:1px dashed var(--border2);border-radius:8px;padding:9px;font-size:22px;color:var(--text);cursor:pointer;font-family:var(--sans);transition:all .15s;margin-top:10px}
.add-task-btn:hover{border-color:var(--accent);color:var(--accent)}
.tl-btns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tl-btns .add-task-btn{margin-top:0;width:100%}
.brk-btn{width:100%;background:none;border:1px dashed var(--border2);border-radius:8px;padding:9px 12px;font-size:22px;color:var(--text);cursor:pointer;font-family:var(--sans);transition:all .15s;white-space:nowrap}
.brk-btn:hover{border-color:var(--break);color:var(--break);background:var(--surface2)}

/* DAILY SUMMARY */
.daily-summary{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-top:14px}
.daily-summary-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.daily-summary-label{font-size:22px;color:var(--text)}
.daily-summary-value{font-family:var(--mono);font-size:42px;font-weight:500;color:var(--amber);flex-shrink:0}
.daily-summary-sub{font-size:20px;color:var(--text2);margin-top:4px}

/* CAT CHIPS */
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.cat-chip{border:1px solid var(--border);border-radius:99px;padding:5px 13px;font-size:19px;color:var(--text3);cursor:pointer;transition:all .15s;background:none;font-family:var(--sans)}
.cat-chip:hover{border-color:var(--border2);color:var(--text2)}

/* CAT EDIT */
.cat-edit-list{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.cat-edit-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:9px;padding:8px 10px;border:1px solid var(--border);min-width:0}
.color-swatch{width:34px;height:34px;border-radius:6px;border:none;cursor:pointer;flex-shrink:0;padding:2px;background:var(--surface2)}
.cat-edit-item input[type=text]{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:22px;font-family:var(--sans)}
.del-cat-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:3px;border-radius:5px;transition:all .15s;display:flex}
.del-cat-btn:hover{color:var(--red);background:rgba(240,107,107,.1)}
.del-cat-btn svg{width:19px;height:19px}
.add-cat-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.add-cat-row input[type=color]{width:44px;height:44px;border-radius:8px;border:1px solid var(--border);cursor:pointer;padding:2px;background:var(--surface2)}
.add-cat-row .t-input{flex:1}

/* SETTINGS SECTIONS */
.settings-body{max-height:56vh;overflow-y:auto;overflow-x:hidden;padding-right:6px}
.set-sec{font-size:17px;letter-spacing:.08em;color:var(--text2);margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.set-sec:first-child{margin-top:0}
.set-sec::after{content:'';flex:1;height:1px;background:var(--border)}
.set-empty{font-size:17px;color:var(--text3);padding:6px 2px}
select.t-input{appearance:none;-webkit-appearance:none;text-overflow:ellipsis;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888894' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center;background-size:18px;padding-right:36px}
.mono-in{font-family:var(--mono);text-align:center;padding-left:6px;padding-right:6px}
.add-proj-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.proj-preview{font-family:var(--mono);font-size:19px;color:var(--accent);text-align:center;margin-top:10px}
.add-proj-row2{display:flex;gap:8px;margin-top:8px}
.add-proj-row2 .t-input{flex:1;min-width:0}
.proj-item{display:flex;align-items:center;gap:9px;background:var(--surface2);border-radius:9px;padding:9px 10px;border:1px solid var(--border);min-width:0}
.proj-code{font-family:var(--mono);font-size:18px;color:var(--text);white-space:nowrap;flex-shrink:0}
.proj-name-in{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text2);font-size:17px;font-family:var(--sans)}
.proj-use{font-size:15px;color:var(--text3);white-space:nowrap;flex-shrink:0}

/* REPORT */
.rep-presets{display:flex;gap:8px;margin-bottom:14px}
.rep-preset{flex:1;padding:8px 2px;font-size:18px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:var(--sans);transition:all .15s}
.rep-preset:hover{border-color:var(--accent);color:var(--accent)}
.date-in{font-family:var(--mono);font-size:17px;min-height:44px;padding-left:8px;padding-right:6px}
.date-in::-webkit-calendar-picker-indicator{margin-left:0;padding:0;opacity:.55}
@media (max-width:360px){.date-in{font-size:15px}.rep-preset{font-size:16px}}
.rep-note{font-size:17px;color:var(--text3);text-align:center;padding:10px 0}

/* PROJECT SUMMARY */
.proj-sum-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2px 16px}
.proj-sum-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.proj-sum-row:first-child{border-top:none}
.proj-sum-info{flex:1;min-width:0}
.proj-sum-code{font-family:var(--mono);font-size:19px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sum-code.none{font-family:var(--sans);color:var(--text2)}
.proj-sum-name{font-size:17px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sum-val{font-family:var(--mono);font-size:24px;color:var(--amber);flex-shrink:0}
.task-proj-d{font-family:var(--mono);font-size:16px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}

/* EXPORT PERIOD */
.exp-period-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.exp-period{text-align:center;min-width:0}
.exp-period-range{font-family:var(--mono);font-size:20px;color:var(--text);white-space:nowrap}
@media (max-width:360px){
  .exp-period-range{font-size:16px}
  .exp-period-nav{gap:6px}
  .export-card{padding:18px 12px}
}
.exp-period-note{font-size:16px;color:var(--text3);margin-top:3px}
.exp-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:2px 0 14px}
.exp-metric{text-align:center}
.exp-metric-label{font-size:17px;color:var(--text3);margin-bottom:4px}
.exp-metric-value{font-family:var(--mono);font-size:28px;font-weight:500}
.exp-metric-value.green{color:var(--green)}
.exp-metric-value.amber{color:var(--amber)}
.exp-empty{text-align:center;font-size:18px;color:var(--text3);padding:6px 0 14px}
.exp-all-btn{width:100%;background:none;border:1px dashed var(--border2);border-radius:10px;padding:10px;font-size:18px;color:var(--text2);cursor:pointer;font-family:var(--sans);transition:all .15s;margin-bottom:10px}
.exp-all-btn:hover{border-color:var(--accent);color:var(--accent)}

/* EXPORT */
.export-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.export-desc{font-size:20px;color:var(--text2);line-height:1.7;margin-bottom:14px}
.export-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

.toast.show{opacity:1}
</style>

<script>
const DAYS_SHORT=['日','月','火','水','木','金','土'];
const DEFAULT_CATS=[
  {label:'MTG',color:'#7F77DD'},
  {label:'連絡・メール',color:'#378ADD'},
  {label:'資料作成',color:'#1D9E75'},
  {label:'開発・制作',color:'#D85A30'},
  {label:'調査',color:'#BA7517'},
  {label:'その他',color:'#888780'},
];

const BREAK_LABEL='休憩';
const BREAK_ICON='break-icon.png';
const BREAK_MIN=30;
const SUN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const MOON_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

const DEPTS=[
  {code:'G',label:'総務'},
  {code:'C',label:'コンテンツ'},
  {code:'H',label:'設計'},
  {code:'L',label:'くらしの道具'},
];

let cats=[];
let editCats=[];
let projects=[];
let editingTaskIdx=-1;
let editingIsBreak=false;
let modalSelectedCat='';
const CLOSING_DAY=15;
let expOffset=0;
let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();
let schDate=new Date();schDate.setHours(0,0,0,0);

function loadCats(){cats=JSON.parse(localStorage.getItem('tc_cats')||'null')||DEFAULT_CATS;}
function saveCats(){localStorage.setItem('tc_cats',JSON.stringify(cats));}
function loadProjects(){try{projects=JSON.parse(localStorage.getItem('tc_projects')||'null')||[];}catch(e){projects=[];}}
function saveProjects(){localStorage.setItem('tc_projects',JSON.stringify(projects));}
function projByCode(c){return projects.find(p=>p.code===c)||null;}
function projLabel(c){const p=projByCode(c);return p&&p.name?`${c}｜${p.name}`:c;}
function sortProjects(a,b){return a.code<b.code?-1:a.code>b.code?1:0;}
/* 案件番号の年月部分。C_02609_001 = 2026年9月 の並びに合わせて 0+YY+MM */
function defaultYm(){const d=new Date();return '0'+String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0');}
function getStorage(){try{return JSON.parse(localStorage.getItem('tc_data')||'{}')}catch(e){return {};}}
function saveStorage(d){localStorage.setItem('tc_data',JSON.stringify(d));}
function fmtDate(d){return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getSchISO(){return toISO(schDate);}
function getDayData(iso){const data=getStorage();if(!data[iso])data[iso]={tasks:[]};return{data,day:data[iso]};}
function timeToMin(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;}
function catByLabel(l){return cats.find(c=>c.label===l)||{label:'その他',color:'#888780'};}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

/* THEME */
function currentTheme(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',t==='light'?'#f5f5f8':'#0f0f11');
  const btn=document.getElementById('themeBtn');
  btn.innerHTML=t==='light'?MOON_SVG:SUN_SVG;
  btn.title=t==='light'?'ダークモードに切替':'ライトモードに切替';
}
function toggleTheme(){
  const t=currentTheme()==='light'?'dark':'light';
  try{localStorage.setItem('tc_theme',t);}catch(e){}
  applyTheme(t);
}
try{
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{
    if(!localStorage.getItem('tc_theme'))applyTheme(e.matches?'light':'dark');
  });
}catch(e){}

function isBreak(t){return !!t.break;}
function sumMinutes(day,wantBreak){
  let total=0;
  (day.tasks||[]).forEach(t=>{
    if(isBreak(t)!==wantBreak)return;
    if(t.start&&t.end){const diff=timeToMin(t.end)-timeToMin(t.start);if(diff>0)total+=diff;}
  });
  return total;
}
function calcTaskMinutes(day){return sumMinutes(day,false);}
function calcBreakMinutes(day){return sumMinutes(day,true);}
/* 既存タスクと時間帯が重なるものを返す（skipIdx は編集中のタスク） */
function findOverlap(tasks,sM,eM,skipIdx){
  return (tasks||[]).find((t,i)=>{
    if(i===skipIdx||!t.start||!t.end)return false;
    return sM<timeToMin(t.end)&&eM>timeToMin(t.start);
  })||null;
}
function minsToHMS(mins){const h=Math.floor(mins/60),m=mins%60;return `${h}:${String(m).padStart(2,'0')}`;}
function fmtMin(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}

/* USER */
function openNameModal(){
  document.getElementById('nameInput').value=localStorage.getItem('tc_name')||'';
  document.getElementById('nameModal').classList.add('open');
  setTimeout(()=>document.getElementById('nameInput').focus(),100);
}
function saveName(){
  const n=document.getElementById('nameInput').value.trim();
  if(!n){showToast('名前を入力してください');return;}
  localStorage.setItem('tc_name',n);closeModal('nameModal');updateUserChip();showToast('名前を保存しました');
}
function updateUserChip(){
  const n=localStorage.getItem('tc_name')||'';
  document.getElementById('userName').textContent=n||'名前を設定';
  document.getElementById('userAvatar').textContent=n?n[0]:'?';
}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});

/* CALENDAR */
function changeMonth(d){
  calMonth+=d;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function renderCalendar(){
  const data=getStorage();
  document.getElementById('calMonthLabel').textContent=`${calYear}年${calMonth+1}月`;
  const grid=document.getElementById('calGrid');grid.innerHTML='';

  ['日','月','火','水','木','金','土'].forEach(d=>{
    const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);
  });

  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=toISO(new Date());
  let workedDays=0,totalMins=0;

  for(let i=firstDay-1;i>=0;i--){
    const cell=document.createElement('div');cell.className='cal-cell empty other-month';
    cell.innerHTML=`<span class="cal-day">${prevDays-i}</span>`;grid.appendChild(cell);
  }

  for(let d=1;d<=daysInMonth;d++){
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayData=data[iso];
    const taskMins=dayData?calcTaskMinutes(dayData):0;
    const hasWork=taskMins>0;
    const dow=new Date(calYear,calMonth,d).getDay();
    if(hasWork){workedDays++;totalMins+=taskMins;}

    const cell=document.createElement('div');
    let cls='cal-cell';
    if(iso===today)cls+=' today';
    if(hasWork)cls+=' worked';
    if(dow===0)cls+=' sun';
    if(dow===6)cls+=' sat';
    cell.className=cls;
    cell.innerHTML=`<span class="cal-day">${d}</span>${hasWork?`<span class="cal-hours">${minsToHMS(taskMins)}</span>`:''}`;
    cell.addEventListener('click',()=>{
      schDate=new Date(calYear,calMonth,d);
      switchTab('schedule',document.querySelectorAll('.tab')[1]);
    });
    grid.appendChild(cell);
  }

  const totalCells=firstDay+daysInMonth;
  const remaining=totalCells%7===0?0:7-(totalCells%7);
  for(let i=1;i<=remaining;i++){
    const cell=document.createElement('div');cell.className='cal-cell empty other-month';
    cell.innerHTML=`<span class="cal-day">${i}</span>`;grid.appendChild(cell);
  }

  document.getElementById('calDays').textContent=workedDays+'日';
  document.getElementById('calHours').textContent=minsToHMS(totalMins);
}

/* 期間集計。出勤日数・実働時間・案件番号ごとの内訳（休憩は除く） */
function aggregateRange(from,to){
  const data=getStorage();
  let days=0,mins=0;const projMins=new Map();
  Object.keys(data).forEach(iso=>{
    if(iso<from||iso>to)return;
    const day=data[iso];
    const m=calcTaskMinutes(day);
    if(m>0){days++;mins+=m;}
    (day.tasks||[]).forEach(t=>{
      if(isBreak(t)||!t.start||!t.end)return;
      const v=timeToMin(t.end)-timeToMin(t.start);
      if(v>0)projMins.set(t.project||'',(projMins.get(t.project||'')||0)+v);
    });
  });
  return {days,mins,projMins};
}
function projSumCard(projMins){
  const card=document.createElement('div');card.className='proj-sum-card';

  const sel=document.getElementById('mProject');sel.innerHTML='';

  projects.forEach(p=>{

function buildModalCats(currentCat){
  const row=document.getElementById('modalCatRow');row.innerHTML='';
  modalSelectedCat=currentCat||'';
  cats.forEach(c=>{
    const chip=document.createElement('button');chip.className='cat-chip';chip.type='button';chip.textContent=c.label;

    chip.onclick=()=>{
      const wasSelected=modalSelectedCat===c.label;
      modalSelectedCat=wasSelected?'':c.label;
      row.querySelectorAll('.cat-chip').forEach(ch=>{ch.style.borderColor='';ch.style.color='';ch.style.background='';});

        const nameEl=document.getElementById('mName');
        if(!nameEl.value||cats.some(cat=>cat.label===nameEl.value))nameEl.value=c.label;

function openTaskModal(idx,presetStart){
  const{day}=getDayData(getSchISO());
  editingTaskIdx=idx;modalSelectedCat='';
  editingIsBreak=idx>=0&&isBreak(day.tasks[idx]);
  document.getElementById('modalCatRow').style.display=editingIsBreak?'none':'flex';
  document.getElementById('mCatLabel').style.display=editingIsBreak?'none':'block';
  document.getElementById('mProjectRow').style.display=editingIsBreak?'none':'block';
  if(idx>=0){
    const t=day.tasks[idx];
    document.getElementById('taskModalTitle').textContent=editingIsBreak?'休憩を編集':'タスクを編集';
    document.getElementById('mStart').value=t.start||'';
    document.getElementById('mEnd').value=t.end||'';
    document.getElementById('mName').value=t.name;
    buildModalProjects(t.project||'');
    buildModalCats(t.category);
  }else{
    document.getElementById('taskModalTitle').textContent='タスクを追加';
    const mStart=document.getElementById('mStart');
    const mEnd=document.getElementById('mEnd');
    [mStart,mEnd].forEach(el=>{el.type='text';el.value='';el.type='time';});
    if(presetStart){
      mStart.value=presetStart;
      const endMin=Math.min(timeToMin(presetStart)+60,24*60-1);
      mEnd.value=`${String(Math.floor(endMin/60)).padStart(2,'0')}:${String(endMin%60).padStart(2,'0')}`;
    }
    document.getElementById('mName').value='';
    buildModalProjects('');
    buildModalCats('');

}
function saveTask(){
  const s=document.getElementById('mStart').value;
  const e=document.getElementById('mEnd').value;
  const n=document.getElementById('mName').value.trim();
  if(!s||!e){showToast('開始と終了の時刻を入力してください');return;}
  if(s>=e){showToast('終了は開始より後にしてください');return;}
  if(!n){showToast('タスク内容を入力してください');return;}
  const iso=getSchISO();const{data,day}=getDayData(iso);
  const dup=findOverlap(day.tasks,timeToMin(s),timeToMin(e),editingTaskIdx);
  if(dup){showToast(`「${dup.name}」(${dup.start}–${dup.end})と重複しています`);return;}
  const task={start:s,end:e,name:n,category:editingIsBreak?BREAK_LABEL:(modalSelectedCat||'その他')};
  if(editingIsBreak)task.break=true;
  else{const pc=document.getElementById('mProject').value;if(pc)task.project=pc;}
  if(editingTaskIdx>=0)day.tasks[editingTaskIdx]=task;
  else day.tasks.push(task);
  data[iso]=day;saveStorage(data);closeModal('taskModal');
  const{day:freshDay}=getDayData(iso);
  renderTimeline(iso,freshDay);renderDailySummary(freshDay);
  showToast(editingTaskIdx>=0?'タスクを更新しました':'タスクを追加しました');
}
document.getElementById('taskModal').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)saveTask();});

/* 30分の休憩スタンプ。AMは10:00・PMは12:00を起点に、空いている直近の30分枠へ入れる */
function addBreak(startH,endH){
  const iso=getSchISO();const{data,day}=getDayData(iso);
  const tasks=day.tasks||[];
  const lo=startH*60,hi=endH*60;
  const anchor=Math.round((startH===0?10*60:12*60)/BREAK_MIN)*BREAK_MIN;
  const free=m=>!findOverlap(tasks,m,m+BREAK_MIN,-1);
  let slot=null;
  for(let m=anchor;m+BREAK_MIN<=hi;m+=BREAK_MIN){if(free(m)){slot=m;break;}}
  if(slot===null)for(let m=anchor-BREAK_MIN;m>=lo;m-=BREAK_MIN){if(free(m)){slot=m;break;}}
  if(slot===null){showToast('この時間帯に空きがありません');return;}
  const start=fmtMin(slot),end=fmtMin(slot+BREAK_MIN);
  day.tasks.push({start,end,name:BREAK_LABEL,category:BREAK_LABEL,break:true});
  data[iso]=day;saveStorage(data);
  renderTimeline(iso,day);renderDailySummary(day);
  showToast(`休憩 ${start}–${end} を追加しました`);
}

function delTask(i){
  const iso=getSchISO();const{data,day}=getDayData(iso);
  if(!confirm(isBreak(day.tasks[i])?'この休憩を削除しますか？':'このタスクを削除しますか？'))return;
  day.tasks.splice(i,1);data[iso]=day;saveStorage(data);
  renderTimeline(iso,day);renderDailySummary(day);showToast('削除しました');
}

/* 休憩ポップ（タスクバーにホバー／長押しで表示し、その位置へ休憩を差し込む） */
let brkPopCtx=null,brkPopHideTimer=null,brkLongPressTimer=null,brkSuppressClick=false;

function hideBrkPop(){
  clearTimeout(brkPopHideTimer);brkPopHideTimer=null;brkPopCtx=null;
  document.getElementById('brkPop').classList.remove('show');
}
function showBrkPop(clientX,barRect,idx,bs){
  const pop=document.getElementById('brkPop');
  clearTimeout(brkPopHideTimer);brkPopHideTimer=null;
  brkPopCtx={idx,bs,be:bs+BREAK_MIN};
  document.getElementById('brkPopText').textContent=`休憩 ${fmtMin(bs)}–${fmtMin(bs+BREAK_MIN)}`;
  pop.classList.add('show');
  const half=pop.offsetWidth/2;
  const cx=Math.min(Math.max(clientX,half+6),window.innerWidth-half-6);
  pop.style.left=cx+'px';
  pop.style.top=(barRect.top-6)+'px';
  pop.style.setProperty('--arrow-x',Math.min(Math.max(clientX-(cx-half),14),pop.offsetWidth-14)+'px');
}
/* タスクを分割して、その間に30分の休憩を挟む */
function insertBreakIntoTask(idx,bs,be){
  const iso=getSchISO();const{data,day}=getDayData(iso);
  const t=day.tasks[idx];
  if(!t||isBreak(t)||!t.start||!t.end){hideBrkPop();return;}
  const ts=timeToMin(t.start),te=timeToMin(t.end);
  if(bs<ts||be>te){showToast('この位置には休憩を入れられません');return;}
  const dup=findOverlap(day.tasks,bs,be,idx);
  if(dup){showToast(`「${dup.name}」と重複しています`);return;}
  const parts=[];
  if(bs>ts)parts.push({...t,end:fmtMin(bs)});
  parts.push({start:fmtMin(bs),end:fmtMin(be),name:BREAK_LABEL,category:BREAK_LABEL,break:true});
  if(be<te)parts.push({...t,start:fmtMin(be)});
  day.tasks.splice(idx,1,...parts);
  data[iso]=day;saveStorage(data);
  hideBrkPop();
  renderTimeline(iso,day);renderDailySummary(day);
  showToast(`休憩 ${fmtMin(bs)}–${fmtMin(be)} を挿入しました`);
}
(function(){
  const pop=document.getElementById('brkPop');
  pop.querySelector('.brk-inline').addEventListener('error',function(){this.replaceWith('☕ ');});
  pop.addEventListener('mouseenter',()=>{clearTimeout(brkPopHideTimer);brkPopHideTimer=null;});
  pop.addEventListener('mouseleave',hideBrkPop);
  pop.addEventListener('click',e=>{
    e.stopPropagation();
    if(brkPopCtx)insertBreakIntoTask(brkPopCtx.idx,brkPopCtx.bs,brkPopCtx.be);
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.brk-pop')&&!e.target.closest('.tl-bar'))hideBrkPop();
  });
  window.addEventListener('scroll',hideBrkPop,{passive:true});
})();

/* TIMELINE */
function renderTimeline(iso,day){
  hideBrkPop();
  const el=document.getElementById('tlContent');el.innerHTML='';
  [{label:'AM  0:00 – 12:00',startH:0,endH:12},{label:'PM  12:00 – 24:00',startH:12,endH:24}].forEach((half,hi)=>{
    const totalMin=(half.endH-half.startH)*60;
    const wrap=document.createElement('div');wrap.className='tl-half';

    const period=document.createElement('div');period.className='tl-period';period.textContent=half.label;wrap.appendChild(period);

    const axis=document.createElement('div');axis.className='tl-axis';
    const hours=half.endH-half.startH;
    for(let h=half.startH;h<half.endH;h++){
      const tick=document.createElement('div');tick.className='tl-tick';tick.textContent=`${h}`;
      tick.style.left=`${(h-half.startH)/hours*100}%`;
      axis.appendChild(tick);
    }
    wrap.appendChild(axis);

    const track=document.createElement('div');track.className='tl-track';track.title='クリックしてタスクを追加';
    const gl=document.createElement('div');gl.className='tl-gridlines';
    for(let i=0;i<(half.endH-half.startH);i++){const gc=document.createElement('div');gc.className='tl-gcell';gl.appendChild(gc);}
    track.appendChild(gl);

    track.addEventListener('click',e=>{
      if(e.target.closest('.tl-bar'))return;
      const rect=track.getBoundingClientRect();
      const rawMin=half.startH*60+(e.clientX-rect.left)/rect.width*totalMin;
      const clickMin=Math.min(Math.round(rawMin/30)*30,half.endH*60-30);
      const hh=String(Math.floor(clickMin/60)).padStart(2,'0');
      const mm=String(clickMin%60).padStart(2,'0');
      openTaskModal(-1,`${hh}:${mm}`);
    });

    day.tasks.forEach((t,i)=>{
      if(!t.start||!t.end)return;
      const sM=timeToMin(t.start),eM=timeToMin(t.end);
      const cS=Math.max(sM,half.startH*60),cE=Math.min(eM,half.endH*60);
      if(cE<=cS)return;
      const brk=isBreak(t);
      const c=catByLabel(t.category);
      const bar=document.createElement('div');bar.className='tl-bar'+(brk?' brk':'');
      bar.style.left=((cS-half.startH*60)/totalMin*100).toFixed(2)+'%';
      bar.style.width=((cE-cS)/totalMin*100).toFixed(2)+'%';
      if(!brk)bar.style.background=c.color;
      if(brk){
        const img=document.createElement('img');
        img.className='brk-icon';img.src=BREAK_ICON;img.alt=BREAK_LABEL;img.draggable=false;
        img.addEventListener('error',()=>{
          img.remove();bar.style.overflow='hidden';bar.style.justifyContent='';
          const s=document.createElement('span');s.className='tl-bar-text';s.textContent=t.name;bar.appendChild(s);
        });
        bar.appendChild(img);
      }else{
        const txt=document.createElement('span');txt.className='tl-bar-text';txt.textContent=t.name;bar.appendChild(txt);
      }
      bar.addEventListener('click',e=>{
        e.stopPropagation();
        if(brkSuppressClick)return;
        openTaskModal(i,null);
      });
      /* 60分以上のタスクだけ。分割しても勤務が30分以上残るようにするため */
      if(!brk&&eM-sM>=60){
        const snap=clientX=>{
          const r=track.getBoundingClientRect();
          const raw=half.startH*60+(clientX-r.left)/r.width*totalMin;
          return Math.min(Math.max(Math.round(raw/BREAK_MIN)*BREAK_MIN,sM),eM-BREAK_MIN);
        };
        bar.addEventListener('mousemove',ev=>showBrkPop(ev.clientX,bar.getBoundingClientRect(),i,snap(ev.clientX)));
        bar.addEventListener('mouseleave',()=>{brkPopHideTimer=setTimeout(hideBrkPop,200);});
        bar.addEventListener('touchstart',ev=>{
          const cx=ev.touches[0].clientX;
          clearTimeout(brkLongPressTimer);
          brkLongPressTimer=setTimeout(()=>{
            brkSuppressClick=true;setTimeout(()=>{brkSuppressClick=false;},700);
            showBrkPop(cx,bar.getBoundingClientRect(),i,snap(cx));
          },450);
        },{passive:true});
        ['touchend','touchmove','touchcancel'].forEach(ev=>
          bar.addEventListener(ev,()=>clearTimeout(brkLongPressTimer),{passive:true}));
      }
      track.appendChild(bar);
    });

    wrap.appendChild(track);
    const hint=document.createElement('div');hint.className='tl-hint';hint.textContent='タップで追加・長押しで休憩';wrap.appendChild(hint);

    const tasksInHalf=day.tasks.map((t,i)=>({...t,i})).filter(t=>{
      if(!t.start)return hi===0;
      return timeToMin(t.start)>=half.startH*60&&timeToMin(t.start)<half.endH*60;
    });
    if(tasksInHalf.length){
      const lw=document.createElement('div');lw.style.cssText='margin-top:10px;border-top:1px solid var(--border);padding-top:10px';
      const list=document.createElement('div');list.className='task-list';
      tasksInHalf.forEach(t=>{
        const c=catByLabel(t.category);
        const dotColor=isBreak(t)?'var(--break)':c.color;
        const item=document.createElement('div');item.className='task-item';
        item.innerHTML=`
          <div class="task-dot" style="background:${dotColor}"></div>
          <div class="task-info">
            <div class="task-name-d">${esc(t.name)}</div>
            <div class="task-time-d">${t.start||'??:??'} – ${t.end||'??:??'} · ${esc(t.category)}</div>
            ${t.project?`<div class="task-proj-d">${esc(t.project)}</div>`:''}
          </div>
          <div class="task-actions">
            <button class="task-act-btn" title="編集"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="task-act-btn del" title="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>`;
        item.querySelectorAll('.task-act-btn')[0].onclick=()=>openTaskModal(t.i,null);
        item.querySelectorAll('.task-act-btn')[1].onclick=()=>delTask(t.i);
        list.appendChild(item);
      });
      lw.appendChild(list);wrap.appendChild(lw);
    }

    const btns=document.createElement('div');btns.className='tl-btns';
    const addBtn=document.createElement('button');addBtn.className='add-task-btn';addBtn.textContent='＋ タスクを追加';addBtn.onclick=()=>openTaskModal(-1,'');
    const brkBtn=document.createElement('button');brkBtn.className='brk-btn';brkBtn.title='30分の休憩を追加';
    const brkIcon=document.createElement('img');brkIcon.className='brk-inline';brkIcon.src=BREAK_ICON;brkIcon.alt='';
    brkIcon.addEventListener('error',()=>brkIcon.replaceWith('☕ '));
    brkBtn.append(brkIcon,'休憩 30分');
    brkBtn.onclick=()=>addBreak(half.startH,half.endH);
    btns.appendChild(addBtn);btns.appendChild(brkBtn);wrap.appendChild(btns);
    el.appendChild(wrap);
  });
}

/* この案件番号を使っているタスク数 */
function projUsage(code){
  let n=0;
  Object.values(getStorage()).forEach(day=>{
    (day.tasks||[]).forEach(t=>{if(t.project===code)n++;});
  });
  return n;
}
function renderProjManage(){
  const list=document.getElementById('projManageList');if(!list)return;
  list.innerHTML='';
  if(!projects.length){
    const em=document.createElement('div');em.className='set-empty';em.textContent='まだ登録がありません';
    list.appendChild(em);return;
  }
  projects.forEach((p,i)=>{
    const used=projUsage(p.code);
    const item=document.createElement('div');item.className='proj-item';
    item.innerHTML=`
      <span class="proj-code">${esc(p.code)}</span>
      <input type="text" class="proj-name-in" value="${esc(p.name||'')}" maxlength="30" placeholder="案件名（任意）" oninput="updateProjName(${i},this.value)">
      ${used?`<span class="proj-use">${used}件</span>`:''}
      <button class="del-cat-btn" onclick="removeProject(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
    list.appendChild(item);
  });
}
function updateProjName(i,v){
  if(!projects[i])return;
  projects[i].name=v.trim();saveProjects();
  renderCalendar();

}
function addProject(){
  const dept=document.getElementById('newProjDept').value;
  const ym=document.getElementById('newProjYm').value.trim();
  const no=document.getElementById('newProjNo').value.trim();
  if(!/^\d{5}$/.test(ym)){showToast('年月は5桁の数字で入力してください');return;}
  if(!/^\d{1,3}$/.test(no)){showToast('番号は3桁までの数字で入力してください');return;}
  const code=`${dept}_${ym}_${no.padStart(3,'0')}`;
  if(projects.some(p=>p.code===code)){showToast('その案件番号は登録済みです');return;}
  projects.push({code,name:document.getElementById('newProjName').value.trim()});
  projects.sort(sortProjects);saveProjects();
  document.getElementById('newProjNo').value='';
  document.getElementById('newProjName').value='';
  updateProjPreview();renderProjManage();renderCalendar();
  showToast(`${code} を追加しました`);
}
function removeProject(i){
  const p=projects[i];if(!p)return;
  const used=projUsage(p.code);
  const msg=used
    ? `${p.code} を削除しますか？\n${used}件のタスクで使用中です（タスクの記録自体は残ります）。`
    : `${p.code} を削除しますか？`;
  if(!confirm(msg))return;
  projects.splice(i,1);saveProjects();
  renderProjManage();renderCalendar();
  if(document.getElementById('tab-schedule').style.display!=='none')renderSchedule();
  showToast('削除しました');
}

  const el=document.getElementById('projPreview');

  const color=document.getElementById('newCatColor').value;
  if(!name){showToast('タスク種別名を入力してください');return;}
  editCats.push({label:name,color});document.getElementById('newCatName').value='';renderCatEditList();
}
function removeCatItem(i){editCats.splice(i,1);renderCatEditList();}
function saveSettings(){
  const valid=editCats.filter(c=>c.label.trim());
  if(!valid.length){showToast('タスク種別が1つ以上必要です');return;}
  cats=valid;saveCats();
  closeModal('settingsModal');showToast('設定を保存しました');
  renderCalendar();
  if(document.getElementById('tab-schedule').style.display!=='none')renderSchedule();
}

/* TABS */
function switchTab(name,btn){
  document.querySelectorAll('[id^="tab-"]').forEach(t=>t.style.display='none');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).style.display='block';btn.classList.add('active');
  if(name==='calendar')renderCalendar();
  if(name==='schedule')renderSchedule();
  if(name==='manage'){initProjManage();initReport();renderExport();}
}
function switchSubTab(name,btn){
  ['projects','report','export'].forEach(n=>document.getElementById('sub-'+n).style.display=n===name?'block':'none');
  document.querySelectorAll('.subtab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(name==='projects')renderProjManage();
  if(name==='report')renderReport();
  if(name==='export')renderExport();
}

/* REPORT — 任意の期間を指定して集計する */
function initReport(){
  const from=document.getElementById('repFrom');
  if(!from.value)setRepPreset('thisMonth');
}
function setRepPreset(kind){
  const t=new Date();
  let start,end;
  if(kind==='thisMonth'){
    start=new Date(t.getFullYear(),t.getMonth(),1);
    end=new Date(t.getFullYear(),t.getMonth()+1,0);
  }else if(kind==='lastMonth'){
    start=new Date(t.getFullYear(),t.getMonth()-1,1);
    end=new Date(t.getFullYear(),t.getMonth(),0);
  }else{
    const r=periodRange(0);start=r.start;end=r.end;
  }
  document.getElementById('repFrom').value=toISO(start);
  document.getElementById('repTo').value=toISO(end);
  renderReport();
}
function renderReport(){
  const wrap=document.getElementById('repTotals');if(!wrap)return;
  wrap.innerHTML='';
  const from=document.getElementById('repFrom').value;
  const to=document.getElementById('repTo').value;
  if(!from||!to){
    const n=document.createElement('div');n.className='rep-note';n.textContent='期間を指定してください';
    wrap.appendChild(n);return;
  }
  if(from>to){
    const n=document.createElement('div');n.className='rep-note';n.textContent='開始日が終了日より後になっています';
    wrap.appendChild(n);return;
  }
  const{days,mins,projMins}=aggregateRange(from,to);
  if(!days&&!projMins.size){
    const n=document.createElement('div');n.className='rep-note';n.textContent='この期間の記録はまだありません';
    wrap.appendChild(n);return;
  }
  wrap.appendChild(metricsRow(days,mins));
  if(projMins.size)wrap.appendChild(projSumCard(projMins));
}

/* EXPORT / IMPORT */
/* 15日締め。offset 0 = 今日を含む期間（16日〜翌15日） */
function periodRange(offset){
  const t=new Date();
  let m=t.getMonth()+(t.getDate()>CLOSING_DAY?1:0)+offset;
  return {start:new Date(t.getFullYear(),m-1,CLOSING_DAY+1),end:new Date(t.getFullYear(),m,CLOSING_DAY)};
}
function periodRecords(){
  const{start,end}=periodRange(expOffset);
  const from=toISO(start),to=toISO(end),data=getStorage(),out={};
  Object.keys(data).forEach(k=>{if(k>=from&&k<=to)out[k]=data[k];});
  return {from,to,records:out};
}
function changeExpPeriod(d){expOffset+=d;renderExport();}
function renderExport(){
  const{start,end}=periodRange(expOffset);
  const endTxt=start.getFullYear()===end.getFullYear()
    ? fmtDate(end).slice(5)
    : fmtDate(end);
  document.getElementById('expRange').textContent=`${fmtDate(start)} – ${endTxt}`;
  const{from,to}=periodRecords();
  const{days,mins,projMins}=aggregateRange(from,to);
  const wrap=document.getElementById('expTotals');wrap.innerHTML='';
  if(!days&&!projMins.size){
    const em=document.createElement('div');em.className='exp-empty';em.textContent='この期間の記録はまだありません';
    wrap.appendChild(em);return;
  }
  wrap.appendChild(metricsRow(days,mins));
  if(projMins.size){
    const card=projSumCard(projMins);card.style.marginBottom='14px';
    wrap.appendChild(card);
  }
}
function exportJSON(all){
  const name=localStorage.getItem('tc_name')||'未設定';
  let records,period=null,suffix;
  if(all){
    records=getStorage();suffix='all';
  }else{
    const r=periodRecords();
    if(!Object.keys(r.records).length){showToast('この期間の記録がありません');return;}
    records=r.records;
    period={closingDay:CLOSING_DAY,from:r.from,to:r.to};
    suffix=`${r.from.replace(/-/g,'')}-${r.to.replace(/-/g,'')}`;
  }
  const payload={employee:name,exportedAt:new Date().toISOString(),period,projects,records};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`timecard_${name}_${suffix}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast(all?'全期間を出力しました':'JSONを出力しました');
}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const json=JSON.parse(ev.target.result);
      const records=json.records||json;
      if(typeof records!=='object'||Array.isArray(records))throw new Error();
      if(!confirm('現在のデータにインポートデータを統合します。よろしいですか？'))return;
      saveStorage({...getStorage(),...records});
      if(json.employee)localStorage.setItem('tc_name',json.employee);
      if(Array.isArray(json.projects)){
        loadProjects();
        const byCode=new Map(projects.map(p=>[p.code,p]));
        json.projects.forEach(p=>{
          if(p&&typeof p.code==='string')byCode.set(p.code,{code:p.code,name:typeof p.name==='string'?p.name:''});
        });
        projects=[...byCode.values()].sort(sortProjects);saveProjects();
      }
      updateUserChip();renderCalendar();renderProjManage();renderReport();renderExport();showToast('インポートしました');
    }catch(err){showToast('JSONの形式が正しくありません');}
  };
  reader.readAsText(file);e.target.value='';
}
function clearAll(){
  if(!confirm('すべての記録を削除しますか？この操作は取り消せません。'))return;
  localStorage.removeItem('tc_data');renderCalendar();renderProjManage();renderReport();renderExport();showToast('データを削除しました');
}

/* INIT */
function init(){
  applyTheme(currentTheme());
  loadCats();loadProjects();updateUserChip();renderCalendar();
  if(!localStorage.getItem('tc_name'))openNameModal();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
